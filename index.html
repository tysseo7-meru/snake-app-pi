<script>
"use strict";
// ---------------- world constants ----------------
const ARENA_R = 2200;            // arena radius (world units)
const ORB_COUNT = 2600; // food doubled again (2026-11-10)
const BOT_COUNT = 19; // 20 snakes in total, player included
const BASE_SPEED = 2.35, BOOST_SPEED = 4.35;
const TURN = 0.095;              // max turn per frame (rad)
const SEG = 4.2;                 // trail point spacing

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
window.addEventListener('resize', resize); resize();
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

const COLORS = ['#ff5d5d','#ffb84d','#f7e94d','#7dff5e','#4dffc3','#4dc9ff','#7d7dff','#c44dff','#ff4da6','#4dff88','#ffd24d','#6af2ff'];
// ---------- snake skins: pre-rendered glossy bead segments with scale arcs ----------
function shadeCol(hex, f) { // f>1 lightens toward white, f<1 darkens
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f >= 1) { r += (255 - r) * (f - 1); g += (255 - g) * (f - 1); b += (255 - b) * (f - 1); }
  else { r *= f; g *= f; b *= f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
const skinCache = new Map();
// Pattern library, modelled on real snake markings and classic snake-game
// skins. Each body colour maps to one designed pattern, so every client
// renders the same snake from its colour alone (no sync needed).
const SKIN_OF = {
  '#ff5d5d': { pat: 'tiger',  accent: '#4d0a14' },
  '#ffb84d': { pat: 'bead' },
  '#f7e94d': { pat: 'bands',  accent: '#3a2c14' },
  '#7dff5e': { pat: 'scales', accent: '#2e8b2e' },
  '#4dffc3': { pat: 'spots',  accent: '#0d7a5f' },
  '#4dc9ff': { pat: 'stripe', accent: '#eaf7ff' },
  '#7d7dff': { pat: 'camo',   accent: '#3d3db0' },
  '#c44dff': { pat: 'spots',  accent: '#f2e6ff' },
  '#ff4da6': { pat: 'rainbow' },
  '#4dff88': { pat: 'bands',  accent: '#eaffea' },
  '#ffd24d': { pat: 'scales', accent: '#a86e12' },
  '#6af2ff': { pat: 'tiger',  accent: '#0b4d66' }
};
const RAINBOW = ['#ff5d5d', '#ffb84d', '#f7e94d', '#7dff5e', '#4dc9ff', '#c44dff'];
function beadCanvas(color, dark, decorate) {
  const c = document.createElement('canvas'); c.width = c.height = 96;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(36, 30, 6, 48, 48, 50);
  grad.addColorStop(0, shadeCol(color, 1.55 * dark));
  grad.addColorStop(0.45, shadeCol(color, 1.12 * dark));
  grad.addColorStop(0.8, shadeCol(color, 0.92 * dark));
  grad.addColorStop(1, shadeCol(color, 0.62 * dark));
  g.fillStyle = grad;
  g.beginPath(); g.arc(48, 48, 47, 0, 6.29); g.fill();
  g.save();
  g.beginPath(); g.arc(48, 48, 47, 0, 6.29); g.clip();
  if (decorate) decorate(g);
  g.strokeStyle = 'rgba(0,0,0,0.13)'; g.lineWidth = 2.2;
  for (const yy of [30, 50, 70]) { g.beginPath(); g.arc(48, yy - 16, 42, 0.35, Math.PI - 0.35); g.stroke(); }
  g.restore();
  const hi = g.createRadialGradient(33, 27, 1, 33, 27, 17);
  hi.addColorStop(0, 'rgba(255,255,255,0.5)'); hi.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hi; g.beginPath(); g.arc(33, 27, 17, 0, 6.29); g.fill();
  g.beginPath(); g.arc(48, 48, 46, 0, 6.29); g.strokeStyle = 'rgba(0,0,0,0.26)'; g.lineWidth = 2.5; g.stroke();
  return c;
}
function skinSprites(color) {
  let s = skinCache.get(color);
  if (s) return s;
  const spec = SKIN_OF[color] || { pat: 'bead' };
  const A = spec.accent || '#222222';
  let list, dir = false;
  switch (spec.pat) {
    case 'bands':
      list = [beadCanvas(color, 1), beadCanvas(A, 1)];
      break;
    case 'spots': {
      const blob = (pts) => (g) => { g.fillStyle = A; g.globalAlpha = 0.75;
        for (const [x, y, r] of pts) { g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill(); } g.globalAlpha = 1; };
      list = [beadCanvas(color, 1, blob([[30, 34, 7], [62, 58, 9], [44, 76, 5]])),
              beadCanvas(color, 0.94, blob([[58, 28, 6], [30, 62, 8], [70, 74, 5]])),
              beadCanvas(color, 1, blob([[40, 48, 10], [68, 36, 5], [24, 74, 6]]))];
      break; }
    case 'camo': {
      const blotch = (pts) => (g) => { g.fillStyle = A; g.globalAlpha = 0.55;
        for (const [x, y, rx, ry, rot] of pts) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, 6.29); g.fill(); } g.globalAlpha = 1; };
      list = [beadCanvas(color, 1, blotch([[30, 36, 14, 9, 0.5], [64, 62, 16, 10, -0.4], [52, 22, 10, 6, 0.2]])),
              beadCanvas(color, 0.95, blotch([[58, 34, 13, 8, -0.6], [28, 66, 15, 9, 0.3], [74, 76, 9, 6, 0]])),
              beadCanvas(color, 1, blotch([[36, 58, 16, 10, 0.9], [66, 26, 11, 7, 0.1], [20, 24, 8, 5, -0.3]]))];
      break; }
    case 'scales': {
      dir = true;
      const plates = (off) => (g) => { g.strokeStyle = A; g.globalAlpha = 0.5; g.lineWidth = 3.4;
        for (const yy of [26 + off, 48 + off, 70 + off]) { g.beginPath(); g.arc(48, yy - 18, 44, 0.3, Math.PI - 0.3); g.stroke(); } g.globalAlpha = 1; };
      list = [beadCanvas(color, 1, plates(0)), beadCanvas(color, 0.93, plates(6))];
      break; }
    case 'stripe': {
      dir = true;
      const stripe = (g) => { g.fillStyle = A; g.globalAlpha = 0.85; g.fillRect(-2, 39, 100, 18); g.globalAlpha = 1; };
      list = [beadCanvas(color, 1, stripe), beadCanvas(color, 0.93, stripe)];
      break; }
    case 'tiger': {
      dir = true;
      const tbands = (g) => { g.fillStyle = A; g.globalAlpha = 0.5;
        for (const xx of [22, 46, 70]) g.fillRect(xx, -2, 8, 100); g.globalAlpha = 1; };
      list = [beadCanvas(color, 1, tbands), beadCanvas(color, 0.93, tbands)];
      break; }
    case 'rainbow':
      list = RAINBOW.map(c => beadCanvas(c, 1));
      break;
    default:
      list = [beadCanvas(color, 1), beadCanvas(color, 0.88)];
  }
  s = { list, dir };
  skinCache.set(color, s);
  return s;
}
// faint hexagon tile for the lake surface (seamless: 192x168 = 4x48 x 4x42 grid)
let _hexTile = null;
function hexTile() {
  if (_hexTile) return _hexTile;
  const c = document.createElement('canvas'); c.width = 192; c.height = 168;
  const g = c.getContext('2d');
  g.strokeStyle = 'rgba(255,255,255,0.055)'; g.lineWidth = 1.4;
  const hex = (cx, cy) => { g.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k + Math.PI / 6; const x = cx + 27.7 * Math.cos(a), y = cy + 28 * Math.sin(a); k ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); g.stroke(); };
  for (let row = -1; row < 6; row++) for (let col = -1; col < 6; col++) hex(col * 48 + (Math.abs(row) % 2 ? 24 : 0), row * 42);
  _hexTile = c;
  return c;
}
const BOT_NAMES = ['Pochi','Hana','Sora','Mugi','Coco','Rin','Taro','Yuki','Mame','Fuku','Saku','Kiki','Momo','Nana','Peko','Toto','Umi','Waka','Lulu'];
let LANG = 'ja';
try { LANG = localStorage.getItem('snakeLang') || 'ja'; } catch (e) {}
const STR = {
  ja: { title: 'Snake Park', desc: '光る粒を食べて長くなろう。他の蛇の体に頭が当たると負け。逆に、自分の体に当てさせれば相手が粒になって食べられる。押している間はブースト（速くなる代わりに少しずつ短くなる）。',
        ph: '名前（例：アキラ）', play: 'あそぶ', how: 'PC：マウスで向き、押している間ブースト／ スマホ：触れた所からドラッグで向き（スティック操作）、右下ボタン長押しでブースト。横画面でも遊べます',
        len: '長さ', rank: '順位', board: 'ランキング', boost: 'ブースト', over: 'ゲームオーバー', again: 'もう一度',
        finalLen: '最終の長さ： ', you: 'あなた', youDown: 'あなたは倒れた…', down: ' が倒れた', by: '（', byEnd: '）',
        bgmOn: 'BGM：オン', bgmOff: 'BGM：オフ', online: 'オンライン', hs: 'ハイスコア', hsAll: 'みんなのハイスコア',
        piStep1: 'Piに接続しています…', piStep2: 'Piでサインインしています…', piStep3: '確認しています…',
        piNg: 'サインインできませんでした。Piブラウザで、アプリのリンクから開いてください。',
        piHint: 'このブラウザではサインインできません。Piブラウザで開いてください。' },
  en: { title: 'Snake Park', desc: 'Eat the glowing orbs to grow longer. If your head touches another snake\'s body, you lose. Make others crash into you and eat the orbs they drop. Hold to boost (faster, but you slowly shrink).',
        ph: 'Name (e.g. Alex)', play: 'Play', how: 'PC: steer with the mouse, hold to boost / Phone: drag anywhere to steer (joystick), hold the button to boost. Landscape works too',
        len: 'Length', rank: 'Rank', board: 'Ranking', boost: 'BOOST', over: 'Game Over', again: 'Play again',
        finalLen: 'Final length: ', you: 'You', youDown: 'You went down…', down: ' went down', by: ' (by ', byEnd: ')',
        bgmOn: 'BGM: On', bgmOff: 'BGM: Off', online: 'Online', hs: 'High Scores', hsAll: "Everyone's High Scores",
        piStep1: 'Connecting to Pi…', piStep2: 'Signing in with Pi…', piStep3: 'Verifying…',
        piNg: 'Could not sign in. Open this app from its link in the Pi Browser.',
        piHint: 'Sign-in is not available in this browser. Please open this app in the Pi Browser.' }
};
if (!STR[LANG]) { LANG = 'ja'; try { localStorage.setItem('snakeLang', LANG); } catch (e) {} } // heal a bad stored language value
function T(k) { const d = STR[LANG] || STR.ja; const v = d[k]; return v !== undefined ? v : k; }
function botNames() { return BOT_NAMES; }
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = T('title');
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('titleTxt', T('title')); set('descTxt', T('desc')); set('playBtn', T('play')); set('howTxt', T('how'));
  set('lenLabel', T('len')); set('rankLabel', T('rank')); set('boardTitle', T('board'));
  set('boostBtn', T('boost')); set('overTxt', T('over')); set('againBtn', T('again')); set('hsTitle', T('hs'));
  const ni = document.getElementById('nameIn'); if (ni) ni.placeholder = T('ph');
  document.querySelectorAll('.langbtn').forEach(b => b.classList.toggle('sel', b.dataset.lang === LANG));
  refreshBgmBtns();
}
const rand = (a, b) => a + Math.random() * (b - a);
function randInArena(margin) {
  const r = Math.sqrt(Math.random()) * (ARENA_R - (margin || 60)), a = rand(0, Math.PI * 2);
  return { x: Math.cos(a) * r, y: Math.sin(a) * r };
}

// ---------------- entities ----------------
let orbs = [];        // {x,y,r,val,color,glow}
let snakes = [];      // snake objects
let player = null;
let running = false, camShake = 0, feedMsgs = [];

function makeOrb(x, y, val, big) {
  return { x, y, r: big ? rand(4.5, 6.5) : rand(2.6, 4.4), val: val || 1,
           color: COLORS[(Math.random() * COLORS.length) | 0], pulse: rand(0, 6.28) };
}
function seedOrbs() { orbs = []; for (let i = 0; i < ORB_COUNT; i++) { const p = randInArena(); orbs.push(makeOrb(p.x, p.y)); } }

function makeSnake(name, color, isPlayer, sx, sy) {
  const a = rand(0, Math.PI * 2);
  const s = { name, color, isPlayer: !!isPlayer, alive: true,
              x: sx, y: sy, ang: a, targetAng: a,
              score: isPlayer ? 12 : 14 + Math.random() * 50, pts: [], boost: false, aiT: 0, aiMode: 'eat', aiTx: 0, aiTy: 0 };
  for (let i = 0; i < 12; i++) s.pts.push({ x: sx - Math.cos(a) * i * SEG, y: sy - Math.sin(a) * i * SEG });
  return s;
}
function radiusOf(s) { return 5.5 + Math.sqrt(Math.max(0, s.score)) * 0.75; }
function trailLen(s) { return 40 + s.score * 7; }

function spawnWorld(playerName) {
  seedOrbs(); snakes = [];
  const pp = randInArena(500);
  player = makeSnake(playerName || 'あなた', COLORS[(Math.random() * COLORS.length) | 0], true, pp.x, pp.y);
  snakes.push(player);
  for (let i = 0; i < BOT_COUNT; i++) {
    const p = randInArena(300);
    snakes.push(makeSnake(botNames()[i % botNames().length], COLORS[i % COLORS.length], false, p.x, p.y));
  }
}

// ---------------- input ----------------
// Input: mouse steers by absolute position (PC). Touch uses a floating
// virtual joystick: touch anywhere and drag — the snake heads in the drag
// direction. Steering and boost are tracked per pointer id, so holding
// BOOST with a second finger never disturbs steering (and vice versa).
let mousePt = null, mouseDown = false;
let joy = null; // {id, ox, oy, x, y} — origin floats along after a 70px drag
cv.addEventListener('pointerdown', e => {

// ---------------- AI ----------------
function aiThink(s) {
  s.aiT--;
  const toC = Math.atan2(-s.y, -s.x), dC = Math.hypot(s.x, s.y);
  // danger: border
  if (dC > ARENA_R - 190) { s.targetAng = toC + rand(-0.4, 0.4); s.boost = dC > ARENA_R - 110; return; }
  // danger: other bodies near head
  const hx = s.x + Math.cos(s.ang) * 34, hy = s.y + Math.sin(s.ang) * 34;
  for (const o of snakes) {
    if (o === s || !o.alive) continue;
    for (let i = 6; i < o.pts.length; i += 5) {
      const p = o.pts[i], dx = hx - p.x, dy = hy - p.y;
      if (dx * dx + dy * dy < 34 * 34) { s.targetAng = Math.atan2(hy - p.y + dy, hx - p.x + dx) + rand(-0.5, 0.5); s.boost = Math.random() < 0.35; return; }
    }
  }
  if (s.aiT <= 0) {
    s.aiT = (18 + Math.random() * 30) | 0;
    s.aiMode = Math.random() < 0.82 ? 'eat' : 'roam';
    if (s.aiMode === 'eat') { // nearest orb cluster
      let best = null, bd = 1e12;
      for (let i = 0; i < orbs.length; i += 3) { const o = orbs[i], dx = o.x - s.x, dy = o.y - s.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = o; } }
      if (best) { s.aiTx = best.x; s.aiTy = best.y; }
    } else { const p = randInArena(500); s.aiTx = p.x; s.aiTy = p.y; }
    s.boost = Math.random() < 0.10 && s.score > 40;
  }
  s.targetAng = Math.atan2(s.aiTy - s.y, s.aiTx - s.x);
}

// ---------------- simulation ----------------
function turnToward(s, dt) {
  let d = s.targetAng - s.ang;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  const m = TURN * dt;
  s.ang += Math.abs(d) < m ? d : Math.sign(d) * m;
}
function stepSnake(s, dt) {
  const wantBoost = s.boost && s.score > 16;
  const sp = (wantBoost ? BOOST_SPEED : BASE_SPEED) * dt;
  s.x += Math.cos(s.ang) * sp; s.y += Math.sin(s.ang) * sp;
  if (wantBoost) { // drain + drop crumbs
    s.score -= 0.055 * dt;
    if (Math.random() < 0.08 * dt && orbs.length < ORB_COUNT + 500) {
      const tail = s.pts[s.pts.length - 1];
      orbs.push(makeOrb(tail.x + rand(-4, 4), tail.y + rand(-4, 4), 1));
    }
  }
  const pts = s.pts;
  // Record a point every ~2 units of head travel. pts[0] must stay FIXED once
  // recorded (never dragged along with the head), or the gap never accumulates
  // on high-refresh / irregular frame timing and the trail silently freezes.
  if (!pts.length) pts.push({ x: s.x, y: s.y });
  else if (Math.hypot(s.x - pts[0].x, s.y - pts[0].y) >= 2) pts.unshift({ x: s.x, y: s.y });
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const seg = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    if (seg > 60) { pts.length = i; break; } // a jump that long is never a real trail segment: cut it
    acc += seg;
    if (acc >= trailLen(s)) { pts.length = i + 1; break; }
  }
  if (pts.length > 700) pts.length = 700;
}
function eatOrbs(s) {
  const r = radiusOf(s) + 5;
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i], dx = o.x - s.x, dy = o.y - s.y;
    if (dx * dx + dy * dy < (r + o.r) * (r + o.r)) { s.score += o.val; orbs.splice(i, 1); if (orbs.length < ORB_COUNT) { const p = randInArena(); orbs.push(makeOrb(p.x, p.y)); } }
  }
}
function killSnake(s, byName) {
  s.alive = false;
  const n = Math.min(s.pts.length, 26 + (s.score | 0));
  for (let i = 0; i < n; i += 2) { const p = s.pts[i]; if (p) orbs.push(makeOrb(p.x + rand(-6, 6), p.y + rand(-6, 6), 2, true)); }
  try { feed(s.isPlayer ? T('youDown') : s.name + T('down') + (byName ? T('by') + byName + T('byEnd') : '')); } catch (e) { showErr('feed: ' + (e && e.message)); }
  if (s.isPlayer) {
    try { publishNow(); } catch (e) { showErr('pub: ' + (e && e.message)); }
    try { gameOver(); } catch (e) { showErr('over: ' + (e && e.message)); forceOverlay(); }
  }
  else setTimeout(() => {
    if (!running) return;
    const idx = snakes.indexOf(s);
    if (idx < 0) return;
    if (botCount() > targetBots()) snakes.splice(idx, 1); // enough humans in: retire this bot
    else { const p = randInArena(300); snakes[idx] = makeSnake(s.name, s.color, false, p.x, p.y); }
  }, 2600);
}
function checkDeaths() {
  for (const s of snakes) {
    if (!s.alive) continue;
    if (Math.hypot(s.x, s.y) > ARENA_R - radiusOf(s) * 0.4) { killSnake(s); continue; }
    for (const o of snakes) {
      if (!o.alive || o === s) continue; // your own body never kills you (pass-through)
      const skip = 4;
      for (let i = skip; i < o.pts.length; i += 3) {
        const p = o.pts[i], dx = s.x - p.x, dy = s.y - p.y, rr = radiusOf(o) * 0.92;
        if (dx * dx + dy * dy < rr * rr) { killSnake(s, o === s ? null : o.name); break; }
      }
      if (!s.alive) break;
    }
  }
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function feed(msg) {
  feedMsgs.push(esc(msg)); if (feedMsgs.length > 4) feedMsgs.shift();
  document.getElementById('feed').innerHTML = feedMsgs.join('<br>');
  setTimeout(() => { feedMsgs.shift(); document.getElementById('feed').innerHTML = feedMsgs.join('<br>'); }, 4200);
}

// ---------------- rendering ----------------
function drawSnake(s, camX, camY, zoom) {
  const r = radiusOf(s);
  const skin = skinSprites(s.color);
  const sp = skin.list;
  const alpha = s.alive ? 0.97 : 0.25;
  // body: patterned bead segments stamped along the trail, tail first.
  // Directional patterns (stripe / tiger / scales) rotate with the body.
  const n = s.pts.length;
  let seg = 0, lastAng = s.ang || 0, lx = 1e9, ly = 1e9;
  for (let i = n - 1; i >= 0; i -= 2) {
    const p = s.pts[i];
    const x = (p.x - camX) * zoom + W / 2, y = (p.y - camY) * zoom + H / 2;
    if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
    const tailT = Math.min(1, (n - i) / (n * 0.25 + 1));
    const rr = Math.max(1.2, r * zoom * (0.35 + 0.65 * tailT)) * 1.14;
    // Stamps overlap heavily (centres ~1-3 px apart, diameter up to ~90 px):
    // skip any stamp that would land almost on top of the previous one.
    const ddx = x - lx, ddy = y - ly;
    if (ddx * ddx + ddy * ddy < (rr * 0.85) * (rr * 0.85)) continue;
    lx = x; ly = y; seg++;
    const spr = sp[seg % sp.length];
    ctx.globalAlpha = alpha;
    if (skin.dir) {
      const q = s.pts[Math.max(0, i - 2)];
      const dx = q.x - p.x, dy = q.y - p.y;
      if (dx * dx + dy * dy > 0.01) lastAng = Math.atan2(dy, dx);
      const ca = Math.cos(lastAng), sa = Math.sin(lastAng);
      ctx.setTransform(DPR * ca, DPR * sa, -DPR * sa, DPR * ca, DPR * x, DPR * y);
      ctx.drawImage(spr, -rr, -rr, rr * 2, rr * 2);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    } else {
      ctx.drawImage(spr, x - rr, y - rr, rr * 2, rr * 2);
    }
  }
  ctx.globalAlpha = 1;
  // head (same skin, full size — guarantees the face sits on the body)
  const hx = (s.x - camX) * zoom + W / 2, hy = (s.y - camY) * zoom + H / 2;
  const hr = r * zoom * 1.14;
  ctx.globalAlpha = alpha;
  if (skin.dir) {
    const ca = Math.cos(s.ang), sa = Math.sin(s.ang);
    ctx.setTransform(DPR * ca, DPR * sa, -DPR * sa, DPR * ca, DPR * hx, DPR * hy);
    ctx.drawImage(sp[0], -hr, -hr, hr * 2, hr * 2);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  } else {
    ctx.drawImage(sp[0], hx - hr, hy - hr, hr * 2, hr * 2);
  }
  ctx.globalAlpha = 1;
  // eyes
  const ex = Math.cos(s.ang), ey = Math.sin(s.ang), px = -ey, py = ex;
  for (const sgn of [-1, 1]) {
    const cx = hx + (ex * r * 0.45 + px * sgn * r * 0.42) * zoom, cy = hy + (ey * r * 0.45 + py * sgn * r * 0.42) * zoom;
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(1.6, r * 0.30 * zoom), 0, 6.29); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx + ex * r * 0.12 * zoom, cy + ey * r * 0.12 * zoom, Math.max(0.9, r * 0.15 * zoom), 0, 6.29); ctx.fillStyle = '#10131f'; ctx.fill();
  }
  // name (soft dark shadow keeps it readable on the light lake surface)
  ctx.font = `600 ${Math.max(10, 12 * zoom)}px sans-serif`; ctx.textAlign = 'center';
  ctx.save();
  ctx.shadowColor = 'rgba(3,43,40,0.65)'; ctx.shadowBlur = 4;
  ctx.fillStyle = s.isPlayer ? '#ffd76a' : 'rgba(255,255,255,0.94)';
  ctx.fillText(s.name, hx, hy - r * zoom - 8);
  ctx.restore();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#17554e'; ctx.fillRect(0, 0, W, H); // deep lake outside the arena
  if (!player) return;
  const zoom = Math.max(0.72, Math.min(1.05, 76 / (radiusOf(player) * 2 + 40))); // gentler pull-back, one notch stronger (v28): big snakes keep more on-screen speed
  const camX = player.x, camY = player.y;
  const acx = (0 - camX) * zoom + W / 2, acy = (0 - camY) * zoom + H / 2, ar = ARENA_R * zoom;
  // lake surface
  const lg = ctx.createRadialGradient(acx, acy, ar * 0.08, acx, acy, ar);
  lg.addColorStop(0, '#abdfd3'); lg.addColorStop(0.55, '#8cd0c0'); lg.addColorStop(1, '#6db7a7');
  ctx.beginPath(); ctx.arc(acx, acy, ar, 0, 6.29); ctx.fillStyle = lg; ctx.fill();
  // faint hexagon pattern fixed to the world, clipped to the arena
  ctx.save();
  ctx.beginPath(); ctx.arc(acx, acy, ar, 0, 6.29); ctx.clip();
  const tile = hexTile(), tw = tile.width, th = tile.height;
  const offx = ((acx % tw) + tw) % tw, offy = ((acy % th) + th) % th;
  for (let x = offx - tw; x < W; x += tw) for (let y = offy - th; y < H; y += th) ctx.drawImage(tile, x, y);
  ctx.restore();
  // arena border (soft shoreline)
  ctx.beginPath(); ctx.arc(acx, acy, ar, 0, 6.29);
  ctx.strokeStyle = 'rgba(240,255,250,0.85)'; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.arc(acx, acy, ar, 0, 6.29);
  ctx.strokeStyle = 'rgba(190,240,225,0.16)'; ctx.lineWidth = 24; ctx.stroke();
  // orbs
  const t = performance.now() / 380;
  for (const o of orbs) {
    const x = (o.x - camX) * zoom + W / 2, y = (o.y - camY) * zoom + H / 2;
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
    const rr = o.r * zoom * (1 + 0.16 * Math.sin(t + o.pulse));
    ctx.beginPath(); ctx.arc(x, y, rr * 1.9, 0, 6.29); ctx.fillStyle = o.color; ctx.globalAlpha = 0.16; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.29); ctx.globalAlpha = 0.95; ctx.fill();
  }
  ctx.globalAlpha = 1;
  const sorted = [...snakes, ...remoteRenderList()].sort((a, b) => radiusOf(a) - radiusOf(b));
  for (const s of sorted) drawSnake(s, camX, camY, zoom);
  // virtual joystick indicator (touch steering)
  if (joy) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, len = Math.hypot(dx, dy) || 1, cl = Math.min(len, 52);
    const kx = joy.ox + dx / len * cl, ky = joy.oy + dy / len * cl;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 52, 0, 6.29); ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(kx, ky, 24, 0, 6.29); ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.fill();
  }
}

// ---------------- HUD ----------------
const lenEl = document.getElementById('lenNow'), rankEl = document.getElementById('rankNow'), boardEl = document.getElementById('boardRows');
let hudT = 0;
function hud(now) {
  if (now - hudT < 220) return; hudT = now;
  const entries = snakes.filter(s => s.alive).map(s => ({ name: s.name, score: s.score, me: s.isPlayer, ref: s }));
  for (const r of activeRemotes()) entries.push({ name: r.name, score: r.score, me: false, ref: null });
  entries.sort((a, b) => b.score - a.score);
  lenEl.textContent = Math.floor(player.score);
  rankEl.textContent = player.alive ? (entries.findIndex(e => e.ref === player) + 1) + ' / ' + entries.length : '-';
  boardEl.innerHTML = entries.slice(0, 5).map((s, i) =>
    `<div class="${s.me ? 'me' : ''}">${i + 1}. ${esc(s.name)}　${Math.floor(s.score)}</div>`).join('');
  const onEl = document.getElementById('onNow');
  if (onEl) onEl.textContent = onlineReady ? '　' + T('online') + ' ' + (1 + remotes.size) : '';
}

// ---------------- main loop ----------------
let last = 0, fpsEMA = 60, frameNo = 0;
function loop(now) {
  requestAnimationFrame(loop);
  frameNo++;
  if (last) fpsEMA = fpsEMA * 0.95 + (1000 / Math.max(1, now - last)) * 0.05;
  const dt = Math.min(4.5, last ? (now - last) / 16.7 : 1); last = now; // clamp 4.5: real-time down to ~13 fps (substepped below)
  if (running && player) {
    try {
      if (joy) {
        const jdx = joy.x - joy.ox, jdy = joy.y - joy.oy;
        if (jdx * jdx + jdy * jdy > 14 * 14) player.targetAng = Math.atan2(jdy, jdx); // small dead zone: keep heading
      } else if (mousePt) {
        const pdx = mousePt.x - W / 2, pdy = mousePt.y - H / 2;
        if (pdx * pdx + pdy * pdy > 30 * 30) player.targetAng = Math.atan2(pdy, pdx); // dead zone near center: keep heading
      }
      player.boost = touchBoost || mouseDown; // touch steering alone is NOT boost
      for (const s of snakes) if (s.alive && !s.isPlayer) aiThink(s);
      // Substep the simulation (max 1.5 dt each) so a low frame rate slows
      // nothing down: physics steps stay small, so no tunnelling, while the
      // total distance per real second stays correct.
      const nSub = Math.max(1, Math.min(3, Math.ceil(dt / 1.5))), sdt = dt / nSub;
      for (let k = 0; k < nSub; k++) {
        for (const s of snakes) {
          if (!s.alive) continue;
          turnToward(s, sdt); stepSnake(s, sdt); eatOrbs(s);
        }
        checkDeaths();
      }
      stepRemotes(dt);
      checkRemoteDeaths();
      hud(now);
    } catch (e) { showErr('loop: ' + (e && e.message)); }
  }
  draw();
}
requestAnimationFrame(loop);

function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
const ksCache = {};
function ksBuffer(m) {
  if (ksCache[m]) return ksCache[m];
  const sr = actx.sampleRate, f = midiHz(m), D = Math.max(2, Math.round(sr / f));
  const len = Math.floor(sr * 1.0);
  const buf = actx.createBuffer(1, len, sr), out = buf.getChannelData(0);
  const ring = new Float32Array(D);
  let prev = Math.random() * 2 - 1;
  for (let i = 0; i < D; i++) { const v = Math.random() * 2 - 1; ring[i] = v - prev; prev = v; }
  let g = 0.996 - (m - 60) * 0.0006; g = Math.min(0.997, Math.max(0.985, g));
  let idx = 0;
  for (let n = 0; n < len; n++) {
    const cur = ring[idx], nxt = ring[(idx + 1) % D];
    ring[idx] = g * 0.5 * (cur + nxt);
    out[n] = cur;
    idx = (idx + 1) % D;
  }
  const cl = Math.floor(sr * 0.004);
  for (let n = 0; n < cl; n++) out[n] += (Math.random() * 2 - 1) * Math.exp(-n / (0.0012 * sr)) * 0.9;
  const kl = Math.floor(sr * 0.03);
  for (let n = 0; n < kl; n++) out[n] += Math.sin(2 * Math.PI * 180 * n / sr) * Math.exp(-n / (0.008 * sr)) * 0.25;
  ksCache[m] = buf;

}
function pluck(m, t, vol) {
  const src = actx.createBufferSource(); src.buffer = ksBuffer(m);
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(g); g.connect(master);

}
function bassThump(m, t, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = midiHz(m);
  const o2 = actx.createOscillator(), g2 = actx.createGain();

  g2.gain.setValueAtTime(vol * 0.35, t);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); g.connect(master); o2.connect(g2); g2.connect(master);

function bgmTick() {
  const horizon = actx.currentTime + 0.18;
  for (;;) {
    const lt = BGM_LEAD[bgmLeadIdx], bt = BGM_BASS[bgmBassIdx];
    const lWhen = lt ? bgmLoopStart + lt[0] : Infinity;
    const bWhen = bt ? bgmLoopStart + bt[0] : Infinity;
    const when = Math.min(lWhen, bWhen);
    if (when > horizon) break;
    const at = Math.max(when, actx.currentTime);
    if (lWhen <= bWhen) { pluck(lt[1], at, lt[2] * 0.9); bgmLeadIdx++; }
    else { bassThump(bt[1], at, bt[2]); bgmBassIdx++; }
    bgmEvt++;
    if (bgmLeadIdx >= BGM_LEAD.length && bgmBassIdx >= BGM_BASS.length) {

        const wasAlive = r.alive;

                           x: d.x, y: d.y, ang: d.ang || 0, seenAt: now,
                           pts: decodePts(d.pts) });

          r.droppedOrbs = true;

function encodePts(pts) {
  const out = [];

}

  const out = [];

               x: r.dispX, y: r.dispY, ang: r.ang, score: r.score,

  if (!player || !player.alive) return;
  for (const r of remotes.values()) {
    if (!r.alive) continue;
    const rr = radiusOf(r) * 0.92;
    for (let i = 4; i < r.pts.length; i += 3) {
      const dx = player.x - r.pts[i].x, dy = player.y - r.pts[i].y;
      if (dx * dx + dy * dy < rr * rr) { killSnake(player, r.name); publishNow(); return; }
    }
  }

// ---------------- high scores (this device, every run, top 10 overall) ----------------
let lastEntry = null;
// One row per person: keep only each name's best score (earliest date wins a tie).
function collapseScores(list) {
  const best = new Map();
  for (const e of list) {
    const cur = best.get(e.name);
    if (!cur || e.score > cur.score || (e.score === cur.score && e.date < cur.date)) best.set(e.name, e);
  }
  return [...best.values()].sort((a, b) => b.score - a.score || a.date - b.date);
}
function loadHighScores() {
  try {
    const list = JSON.parse(localStorage.getItem('snakeHighScores') || '[]');
    if (!Array.isArray(list)) return [];
    const clean = list.filter(e => e && typeof e.name === 'string' && typeof e.score === 'number')
               .map(e => ({ name: e.name, score: e.score, date: typeof e.date === 'number' ? e.date : 0 }));
    return collapseScores(clean);
  } catch (e) { return []; }
}
function recordHighScore() {
  const sc = Math.floor(player.score);
  if (sc > 0) {
    lastEntry = { name: player.name, score: sc, date: Date.now() };
    const list = collapseScores(loadHighScores().concat([lastEntry])); // one row per person: best only
    try { localStorage.setItem('snakeHighScores', JSON.stringify(list.slice(0, 30))); } catch (e) {}
  }
  renderHighScores();
}
function renderHighScores() {
  const el = document.getElementById('hsList');
  if (!el) return;
  const t = document.getElementById('hsTitle'); if (t) t.textContent = T('hs');
  const list = loadHighScores();
  el.innerHTML = list.length
    ? list.slice(0, 20).map((e, i) => `<div class="${lastEntry && e.name === lastEntry.name && e.score === lastEntry.score && e.date === lastEntry.date ? 'me' : ''}">${i + 1}. ${esc(e.name)}　${e.score}</div>`).join('')
    : '<div>-</div>';
}

// ---------------- shared high scores (Firestore: snakeScores) ----------------

  if (!name || !(score > 0)) return;
  const list = loadHighScores();
  const row = list.find(e => e.name === name);
  if (row && row.score >= score) return;
  const merged = collapseScores(list.concat([{ name, score, date: row ? row.date : Date.now() }]));
  try { localStorage.setItem('snakeHighScores', JSON.stringify(merged.slice(0, 30))); } catch (e) {}

function submitScore() {
  const col = scoresCol();
  if (!col || !myId || !fbDb) return;
  try {
    const mine = player ? loadHighScores().find(e => e.name === player.name) : null;
    let best = mine ? Math.floor(mine.score) : (player ? Math.floor(player.score) : 0);
    let name = String((player && player.name) || '???').slice(0, 24);
    const pend = pendingBest();
    if (pend && pend.score > best) { best = Math.floor(pend.score); name = String(pend.name || name).slice(0, 24); }
    if (best <= 0) return;
    try { localStorage.setItem('snakePendingBest', JSON.stringify({ name, score: best })); } catch (e) {}
    const ref = col.doc(myId);
    fbDb.runTransaction(tx => tx.get(ref).then(snap => {
      const cur = snap.exists && typeof snap.data().score === 'number' ? snap.data().score : 0;
      if (cur >= best) return cur; // server already holds at least this much: never lower it
      tx.set(ref, { name, score: best, t: Date.now() });
      return best;
    })).then(held => {
      try { localStorage.removeItem('snakePendingBest'); } catch (e) {}
      if (typeof held === 'number') healLocalFromServer(name, Math.floor(held));
      renderGlobalScores();
    }).catch(() => { /* pending stays in localStorage and is retried later */ });
  } catch (e) {}
}
function renderGlobalScores() {
  const col = scoresCol();
  if (!col) return;
  col.orderBy('score', 'desc').limit(50).get().then(snap => {
    const rows = [];
    snap.forEach(d => { const v = d.data(); if (v && typeof v.score === 'number') rows.push({ id: d.id, name: String(v.name || '???'), score: v.score }); });
    const own = rows.find(r => r.id === myId);
    if (own) healLocalFromServer(own.name, Math.floor(own.score));
    if (!rows.length) return;
    const el = document.getElementById('hsList'); if (!el) return;
    const t = document.getElementById('hsTitle'); if (t) t.textContent = T('hsAll');
    el.innerHTML = rows.slice(0, 20).map((r, i) => `<div class="${r.id === myId ? 'me' : ''}">${i + 1}. ${esc(r.name)}　${Math.floor(r.score)}</div>`).join('');
  }).catch(() => {});
}

// ---------------- screens ----------------
const startScr = document.getElementById('startScr'), overScr = document.getElementById('overScr');
function startGame() {
  const name = document.getElementById('nameIn').value.trim() || T('you');
  try { localStorage.setItem('snakeName', name); } catch (e) {}
  spawnWorld(name);
  bgmStart();
  running = true;
  publishNow();
  startScr.classList.add('hidden'); overScr.classList.add('hidden');
}
function gameOver() {
  running = false;
  document.getElementById('overStats').textContent = T('finalLen') + Math.floor(player.score);
  setTimeout(() => overScr.classList.remove('hidden'), 650); // show the screen first: scoring must never block it
  try { recordHighScore(); } catch (e) {}
  try { submitScore(); renderGlobalScores(); } catch (e) {}
}
document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
document.getElementById('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
try { const n = localStorage.getItem('snakeName'); if (n) document.getElementById('nameIn').value = n; } catch (e) {}
document.querySelectorAll('.bgmbtn').forEach(b => b.addEventListener('click', toggleBgm));
document.querySelectorAll('.langbtn').forEach(b => b.addEventListener('click', () => {
  if (!STR[b.dataset.lang]) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem('snakeLang', LANG); } catch (e) {}
  applyLang();
}));
applyLang();
piBoot();
document.getElementById('verTag').textContent = 'Snake Park Pi v24';

// ---------------- Pi Network sign-in (Pi Browser build) ----------------
// App Studio flow: Pi.init -> Pi.authenticate(["username"]) -> exchange the
// accessToken exactly ONCE with App Studio. Only the exchange response's
// uid/username are trusted as identity (never the authenticate result).
// sessionToken is kept in memory only. This build is Pi-Browser-only: the
// gate lifts on success; on failure/timeout it stays up with guidance.
let piUser = null, piSessionToken = null;
function piSetStatus(t) { const el = document.getElementById('piStatus'); if (el) el.textContent = t; }
function onIncompletePaymentFound(payment) { if (window.console) console.log('[pi] incomplete payment (ignored - this app takes no payments)', payment && payment.identifier); }
async function piBoot() {
  const gate = document.getElementById('pi-gate');
  // Opened outside Pi Browser (e.g. Safari): sign-in can never complete
  // there, so show the guidance immediately instead of after the 60 s
  // watchdog. The normal flow continues untouched; the hint never blocks.
  if (!/PiBrowser/i.test(navigator.userAgent || '')) {
    const hint = document.getElementById('piHint');
    if (hint) { hint.innerHTML = esc(T('piHint')) + '<br><a href="https://snakeparkmocovs3958.pinet.com" style="color:#7ab8ff">snakeparkmocovs3958.pinet.com</a>'; hint.classList.remove('hidden'); }
  }
  let done = false;
  const fail = () => { if (done) return; done = true; const el = document.getElementById('piStatus'); if (el) el.innerHTML = esc(T('piNg')) + '<br><a href="https://snakeparkmocovs3958.pinet.com" style="color:#7ab8ff">snakeparkmocovs3958.pinet.com</a>'; startSync(); };
  const watchdog = setTimeout(fail, 60000); // authenticate/exchange may never answer (e.g. opened outside Pi Browser)
  try {
    if (!window.Pi || typeof Pi.init !== 'function' || typeof Pi.authenticate !== 'function') { clearTimeout(watchdog); fail(); return; }
    piSetStatus(T('piStep1'));
    await Pi.init({ version: '2.0' });
    piSetStatus(T('piStep2'));
    const auth = await Pi.authenticate(['username'], onIncompletePaymentFound);
    piSetStatus(T('piStep3'));
    const res = await fetch('https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com/pi/auth/v1/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken: auth.accessToken })
    });
    if (!res.ok) throw new Error('exchange ' + res.status);
    const data = await res.json();
    if (!data || !data.user || !data.user.uid) throw new Error('bad exchange response');
    done = true; clearTimeout(watchdog);
    piSessionToken = data.sessionToken || null; // memory only, never stored
    piUser = { uid: data.user.uid, username: data.user.username }; // identity ONLY from App Studio
    myId = 'pi:' + piUser.uid;
    try { localStorage.setItem('snakePlayerId', myId); localStorage.setItem('snakeName', piUser.username); } catch (e) {}
    const ni = document.getElementById('nameIn');
    if (ni && piUser.username) { ni.value = piUser.username; ni.readOnly = true; }
    if (gate) gate.classList.add('hidden');
    startSync();
    setTimeout(() => { try { submitScore(); } catch (e) {} }, 1500); // retry a best score that failed to send last time
  } catch (e) { clearTimeout(watchdog); fail(); }
}

// ---------------- diagnostics + game-over watchdog ----------------
function showErr(msg) {
  const el = document.getElementById('errLine');
  if (el) { el.style.display = 'block'; el.textContent = 'ERR: ' + msg; }
  try { localStorage.setItem('snakeLastErr', String(msg).slice(0, 200)); } catch (e) {}
}
function forceOverlay() {
  try { document.getElementById('overStats').textContent = T('finalLen') + Math.floor(player.score); } catch (e) {}
  try { renderHighScores(); } catch (e) {}
  overScr.classList.remove('hidden');
}
window.addEventListener('error', e => showErr(e.message || 'unknown'));
window.addEventListener('unhandledrejection', e => showErr((e.reason && e.reason.message) || 'promise'));
let deadAt = 0;
setInterval(() => {
  if (player && !player.alive) {
    if (!deadAt) deadAt = Date.now();
    if (Date.now() - deadAt > 1500 && overScr.classList.contains('hidden')) forceOverlay(); // watchdog: the game-over screen must appear
  } else deadAt = 0;
}, 500);
spawnWorld(T('you')); // backdrop demo behind the start screen
